<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trouve Ton Toit Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0F1117;--s:#1A1D27;--s2:#22263A;--b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.12);--bleu:#1B4FD8;--green:#4CAF7D;--gold:#E8A020;--red:#E05A5A;--txt:#F0EDE8;--tm:rgba(240,237,232,.45);--td:rgba(240,237,232,.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif,system-ui;background:var(--bg);color:var(--txt);min-height:100vh}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:var(--s);border:1px solid var(--b2);border-radius:20px;padding:2rem;width:100%;max-width:360px;text-align:center}
.logo{font-size:1.6rem;font-weight:900;color:var(--bleu);margin-bottom:.3rem}
.fi{width:100%;padding:.65rem .9rem;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--txt);font-size:.9rem;outline:none;margin-bottom:.75rem}
.btn{padding:.65rem 1.4rem;border-radius:8px;border:none;font-size:.88rem;font-weight:700;cursor:pointer;width:100%}
.bp{background:var(--bleu);color:white}
.admin{display:none;padding:1.5rem 2rem;max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--b)}
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem}
.tab{padding:.45rem 1rem;border-radius:8px;border:1px solid var(--b);background:none;color:var(--tm);cursor:pointer;font-size:.83rem;font-weight:600}
.tab.act{background:var(--bleu);color:white;border-color:var(--bleu)}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;overflow:hidden;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.kcard{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:1.1rem 1.3rem}
.klabel{font-size:.7rem;color:var(--td);font-weight:600;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.4px}
.kval{font-size:1.8rem;font-weight:800}
.badge{padding:.2rem .6rem;border-radius:100px;font-size:.68rem;font-weight:700}
.b-gold{background:rgba(212,168,71,.15);color:var(--gold)}
.b-green{background:rgba(76,175,125,.15);color:var(--green)}
.b-red{background:rgba(224,90,90,.15);color:var(--red)}
.b-dim{background:rgba(255,255,255,.06);color:var(--td)}
.locataire-row{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;border-bottom:1px solid var(--b)}
.locataire-row:last-child{border-bottom:none}
.av{width:38px;height:38px;border-radius:50%;background:var(--bleu);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem;flex-shrink:0}
.docs-grid{display:flex;gap:.4rem;flex-wrap:wrap}
.doc-chip{padding:.2rem .5rem;border-radius:6px;font-size:.65rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.doc-ok{background:rgba(76,175,125,.15);color:var(--green)}
.doc-miss{background:rgba(255,255,255,.05);color:var(--td)}
.action-btn{padding:.35rem .75rem;border-radius:7px;border:none;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s}
.verify-btn{background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.3)}
.verify-btn:hover{background:#4CAF7D;color:white}
.refuser-btn{background:rgba(224,90,90,.1);color:var(--red);border:1px solid rgba(224,90,90,.3)}
.refuser-btn:hover{background:var(--red);color:white}
.sp{width:18px;height:18px;border:2px solid rgba(224,90,58,.2);border-top-color:var(--bleu);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--s2);color:var(--txt);padding:.85rem 1.4rem;border-radius:12px;font-size:.85rem;z-index:1000;transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none;border:1px solid var(--b2)}
.toast.show{transform:translateY(0);opacity:1}
.search{padding:.55rem .9rem;background:var(--s2);border:1px solid var(--b2);border-radius:8px;color:var(--txt);font-size:.85rem;outline:none;width:260px}
img.doc-thumb{width:60px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--b2);cursor:pointer}
img.doc-thumb:hover{border-color:var(--bleu)}
</style>
</head>
<body>

<!-- Login -->
<div class="login" id="login-screen">
  <div class="login-box">
    <div class="logo"><span style="color:var(--primary,#1B4FD8)">T</span>rouve<span style="color:var(--primary,#1B4FD8)">T</span>on<span style="color:var(--primary,#1B4FD8)">T</span>oit</div>
    <div style="font-size:.78rem;color:var(--td);margin-bottom:1.5rem">Admin Panel</div>
    <input class="fi" type="password" id="pwd" placeholder="Admin password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn bp" onclick="login()">Se connecter →</button>
    <div id="login-err" style="color:var(--red);font-size:.78rem;margin-top:.5rem"></div>
  </div>
</div>

<!-- Admin -->
<div class="admin" id="admin-screen">
  <div class="topbar">
    <div>
      <div style="font-size:1.1rem;font-weight:800">🏠 Trouve Ton Toit Admin</div>
      <div style="font-size:.75rem;color:var(--td);margin-top:.1rem">Identity verification — locataires & propriétaires</div>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <input class="search" id="search" placeholder="Rechercher by name or email..." oninput="filterLocataires(this.value)">
      <button class="btn" style="background:rgba(255,255,255,.06);color:var(--tm);border:1px solid var(--b);padding:.5rem .9rem;font-size:.8rem;width:auto" onclick="loadAll()">🔄 Refresh</button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="grid" style="grid-template-columns:repeat(7,1fr)">
    <div class="kcard"><div class="klabel">Locataires</div><div class="kval" id="k-total" style="color:var(--txt)">—</div></div>
    <div class="kcard"><div class="klabel">Propriétaires</div><div class="kval" id="k-propriétaires" style="color:var(--txt)">—</div></div>
    <div class="kcard"><div class="klabel">Agents</div><div class="kval" id="k-agents" style="color:var(--txt)">—</div></div>
    <div class="kcard"><div class="klabel">En attente</div><div class="kval" id="k-en attente" style="color:var(--gold)">—</div></div>
    <div class="kcard"><div class="klabel">Vérifié</div><div class="kval" id="k-vérifié" style="color:var(--green)">—</div></div>
    <div class="kcard"><div class="klabel">T. Vérifié</div><div class="kval" id="k-t-vérifié" style="color:var(--green)">—</div></div>
    <div class="kcard"><div class="klabel">L. Vérifié</div><div class="kval" id="k-l-vérifié" style="color:var(--green)">—</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab act" onclick="setTab('en attente',this)">⏳ En attente</button>
    <button class="tab" onclick="setTab('vérifié',this)">✅ Vérifié</button>
    <button class="tab" onclick="setTab('locataires',this)">🧳 Locataires</button>
    <button class="tab" onclick="setTab('propriétaires',this)">🏠 Propriétaires</button>
    <button class="tab" onclick="setTab('agents',this)">🏆 Agents</button>
    <button class="tab" onclick="setTab('all',this)">👥 All</button>
  </div>

  <div id="locataires-list"><div style="text-align:center;padding:2rem;color:var(--td)"><div class="sp"></div></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SU='https://hkhmktcbyfyacwfmoyxy.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraG1rdGNieWZ5YWN3Zm1veXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzIxMjcsImV4cCI6MjEwNTE0ODEyN30.PhI80G7KHgeh-E6urTVjzld8ThBHLbFDV8HkHLd_bWE';
const sb = window.supabase.createClient(SU, SK, {auth:{persistSession:false}});

const ADMIN_PWD = 'Trouve Ton Toit2024!'; // Change this!
let allLocataires = [];
let currentTab = 'en attente';

function login(){
  const pwd = document.getElementById('pwd').value;
  if(pwd === ADMIN_PWD){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('login-err').textContent = 'Wrong password';
  }
}

async function loadAll(){
  const wrap = document.getElementById('locataires-list');
  wrap.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--td)"><div class="sp"></div></div>';

  const{data:profiles} = await sb.from('profiles').select('*').in('role',['locataire','Locataire','propriétaire','Propriétaire','agent','Agent']).order('created_at',{ascending:false});
  allLocataires = profiles || [];

  const locataires = allLocataires.filter(p=>p.role?.toLowerCase()==='locataire');
  const propriétaires = allLocataires.filter(p=>p.role?.toLowerCase()==='propriétaire');
  const agents = allLocataires.filter(p=>p.role?.toLowerCase()==='agent');

  // KPIs
  document.getElementById('k-total').textContent = locataires.length;
  document.getElementById('k-propriétaires').textContent = propriétaires.length;
  document.getElementById('k-agents').textContent = agents.length;
  document.getElementById('k-en attente').textContent = allLocataires.filter(p=>p.id_submitted&&!p.vérifié).length;
  document.getElementById('k-vérifié').textContent = allLocataires.filter(p=>p.vérifié).length;
  document.getElementById('k-t-vérifié').textContent = locataires.filter(p=>p.vérifié).length;
  document.getElementById('k-l-vérifié').textContent = propriétaires.filter(p=>p.vérifié).length;

  renderLocataires();
}

function setTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));
  btn.classList.add('act');
  renderLocataires();
}

function filterLocataires(q){
  renderLocataires(q);
}

function renderLocataires(q=''){
  const wrap = document.getElementById('locataires-list');
  let locataires = allLocataires;

  if(currentTab === 'en attente') locataires = locataires.filter(p=>p.id_submitted&&!p.vérifié);
  if(currentTab === 'vérifié') locataires = locataires.filter(p=>p.vérifié);
  if(currentTab === 'locataires') locataires = locataires.filter(p=>p.role?.toLowerCase()==='locataire');
  if(currentTab === 'propriétaires') locataires = locataires.filter(p=>p.role?.toLowerCase()==='propriétaire');
  if(currentTab === 'agents') locataires = locataires.filter(p=>p.role?.toLowerCase()==='agent');
  if(q) locataires = locataires.filter(p=>(p.full_name||'').toLowerCase().includes(q.toLowerCase())||(p.email||'').toLowerCase().includes(q.toLowerCase()));

  if(!locataires.length){
    wrap.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--td)">'+
      (currentTab==='en attente'?'No en attente verifications 🎉':currentTab==='vérifié'?'No vérifié users yet':currentTab==='locataires'?'No locataires yet':currentTab==='propriétaires'?'No propriétaires yet':'No users found')+'</div>';
    return;
  }

  wrap.innerHTML = '<div class="card">'+locataires.map(p=>`
    <div class="locataire-row" id="row-${p.clerk_id}">
      <div class="av">${(p.full_name||'?')[0].toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem">
          <div style="font-size:.9rem;font-weight:700">${p.full_name||'—'}</div>
          <span class="badge ${p.role?.toLowerCase()==='propriétaire'?'b-gold':p.role?.toLowerCase()==='agent'?'b-green':'b-dim'}" style="font-size:.62rem">${p.role?.toLowerCase()==='propriétaire'?'🏠 Propriétaire':p.role?.toLowerCase()==='agent'?'🏆 Agent':'🧳 Locataire'}</span>
          ${p.vérifié?'<span class="badge b-green">✅ Vérifié</span>':p.id_submitted?'<span class="badge b-gold">⏳ En attente</span>':'<span class="badge b-dim">Not submitted</span>'}
        </div>
        <div style="font-size:.72rem;color:var(--td);margin-bottom:.4rem">${p.email||'—'} · ${p.nationality||'—'} · ${p.phone||'—'}</div>
        <div id="docs-${p.clerk_id}" style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
          <span style="font-size:.7rem;color:var(--td)">Chargement docs...</span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:.35rem;flex-shrink:0">
        ${!p.vérifié && p.id_submitted ? `
        <button class="action-btn verify-btn" onclick="verifyLocataire('${p.clerk_id}','${(p.full_name||'').replace(/'/g,"\\'")}')">✅ Verify</button>
        <button class="action-btn refuser-btn" onclick="rejectLocataire('${p.clerk_id}')">❌ Refuser</button>` : ''}
        ${p.vérifié ? '<span style="font-size:.72rem;color:var(--green)">✅ Vérifié '+new Date(p.vérifié_at||p.updated_at).toLocaleDateString('en-GB')+'</span>' : ''}
        <button class="action-btn" style="background:rgba(255,255,255,.06);color:var(--tm);border:1px solid var(--b);font-size:.7rem" onclick="viewProfile('${p.clerk_id}')">👁 Profil</button>
      </div>
    </div>`).join('')+'</div>';

  // Charger les docs pour chaque locataire
  locataires.forEach(p => loadLocataireDocs(p.clerk_id));
}

async function loadLocataireDocs(clerkId){
  const wrap = document.getElementById('docs-'+clerkId);
  if(!wrap) return;
  try{
    // Chercher dans les 3 chemins (ancien bucket + nouveau bucket dossier)
    const[r1,r2,r3] = await Promise.all([
      sb.storage.from('locataire-documents').list('id-docs/'+clerkId, {limit:10}),
      sb.storage.from('locataire-documents').list('docs/'+clerkId, {limit:20}),
      sb.storage.from('documents-dossiers').list('dossier/'+clerkId, {limit:50})
    ]);
    const allFiles = [
      ...(r1.data||[]).map(f=>({...f, bucket:'locataire-documents', path:'id-docs/'+clerkId+'/'+f.name})),
      ...(r2.data||[]).map(f=>({...f, bucket:'locataire-documents', path:'docs/'+clerkId+'/'+f.name})),
      ...(r3.data||[]).map(f=>({...f, bucket:'documents-dossiers', path:'dossier/'+clerkId+'/'+f.name}))
    ];

    let html = '';
    for (const f of allFiles){
      const{data:url} = await sb.storage.from(f.bucket).createSignedUrl(f.path, 3600);
      if(!url?.signedUrl) continue;
      const ext = f.name.split('.').pop().toLowerCase();
      const isImg = ['jpg','jpeg','png','gif','webp'].includes(ext);
      const label = f.name.replace(/\.[^.]+$/,'');
      html += isImg
        ? `<a href="${url.signedUrl}" target="_blank" title="${f.name}"><img class="doc-thumb" src="${url.signedUrl}" alt="${f.name}"></a>`
        : `<a href="${url.signedUrl}" target="_blank" class="doc-chip doc-ok">📄 ${label}</a>`;
    }

    if(!html) html = '<span style="font-size:.7rem;color:var(--td)">No documents uploaded</span>';
    wrap.innerHTML = html;
  }catch(e){
    wrap.innerHTML = '<span style="font-size:.7rem;color:var(--td)">—</span>';
  }
}

async function verifyLocataire(clerkId, name){
  if(!confirm('Verify '+name+'? This will grant the ✅ badge.')) return;
  const{error} = await sb.from('profiles').update({vérifié:true, vérifié_at:new Date().toISOString()}).eq('clerk_id',clerkId);
  if(error){toast('❌ Erreur: '+error.message);return;}
  toast('✅ '+name+' vérifié!');
  // Notifier le locataire
  try{
    await sb.from('messages').insert({
      listing_id:'00000000-0000-0000-0000-000000000000',
      sender_id:'system',
      receiver_id:clerkId,
      content:'🎉 Your identity has been vérifié by Trouve Ton Toit!\n\nYour ✅ Vérifié badge is now visible to all propriétaires. This increases votre chances of being selected.',
      type:'vérifié'
    });
  }catch(e){console.warn('Notify error:',e);}
  loadAll();
}

async function rejectLocataire(clerkId){
  const reason = prompt('Reason pour rejection (will be sent to locataire):');
  if(!reason) return;
  await sb.from('profiles').update({id_submitted:false}).eq('clerk_id',clerkId);
  try{
    await sb.from('messages').insert({
      listing_id:'00000000-0000-0000-0000-000000000000',
      sender_id:'system',
      receiver_id:clerkId,
      content:'⚠️ Your identity verification was not approuvé.\n\nReason: '+reason+'\n\nPbail re-upload votre documents in votre profil.',
      type:'verify_refusé'
    });
  }catch(e){}
  toast('Locataire notified of rejection.');
  loadAll();
}

function viewProfile(clerkId){
  window.open('https://supabase.com/tableau de bord/project/clfqftbvohwybkrtvylo/editor?schema=public&table=profiles&filter=clerk_id%3Aeq%3A'+clerkId,'_blank');
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
</html>
