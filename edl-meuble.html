label.f{display:block;font-size:.74rem;font-weight:700;color:var(--td);margin-bottom:.2rem;text-transform:uppercase;letter-spacing:.03em}

.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px));display:flex;gap:.5rem;justify-content:center;align-items:center;z-index:40}

.legal{font-size:.74rem;color:var(--td);line-height:1.5}
.ro .et:not(.on),.ro .ph button,.ro .ph-add,.ro .row-actions,.ro .room-del{display:none!important}

  .card,.room{break-inside:avoid;border-color:#ccc}.room-b{display:block!important}
  .et:not(.on){display:none}.panel{display:block!important}
}
</style>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────

const SB_URL='https://hkhmktcbyfyacwfmoyxy.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraG1rdGNieWZ5YWN3Zm1veXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NzIxMjcsImV4cCI6MjEwNTE0ODEyN30.PhI80G7KHgeh-E6urTVjzld8ThBHLbFDV8HkHLd_bWE';

// ── Référentiels ────────────────────────────────────────────────────────────
const ETATS=[['neuf','Neuf'],['tb','Très bon'],['bon','Bon'],['usage','Usagé'],['mauvais','Mauvais']];

const BASE_EL=['Sol','Murs','Plafond','Plinthes','Porte(s) et serrure','Fenêtre(s) et vitrages','Volets / occultation','Prises et interrupteurs','Éclairage','Chauffage / radiateur'];

  sdb:{name:'Salle de bain',el:['Sol','Murs et faïence','Plafond','Lavabo et robinetterie','Douche / baignoire','Joints','Miroir','Ventilation (VMC)','Prises et interrupteurs','Éclairage','Chauffage / sèche-serviettes']},
  wc:{name:'WC',el:['Sol','Murs','Plafond','Cuvette et abattant','Chasse d\'eau','Lave-mains','Ventilation (VMC)','Éclairage']},
  exterieur:{name:'Balcon / terrasse',el:['Sol','Garde-corps','Éclairage extérieur']},
  parking:{name:'Emplacement',el:['Sol','Marquage au sol / numéro','Murs','Plafond','Porte / portail du box','Serrure','Éclairage','Prise électrique / borne','Propreté générale']},
  acces:{name:'Accès commun',el:['Portail / porte d\'accès','Rampe / allée de circulation','Éclairage des parties communes']},
  autre:{name:'Pièce',el:BASE_EL}
};
// Décret n° 2015-981 du 31 juillet 2015 — mobilier minimum d'un logement meublé
const INV_OBLIG=[
  ['cuisine','Plaques de cuisson'],
  ['cuisine','Four ou four à micro-ondes'],
  ['cuisine','Réfrigérateur avec compartiment congélation (≤ -6 °C)'],
  ['cuisine','Vaisselle pour la prise des repas'],
  ['cuisine','Ustensiles de cuisine'],
  ['sejour','Table'],
  ['sejour','Sièges / chaises'],
  ['chambre','Literie avec couette ou couverture'],
  ['chambre','Rideaux / volets occultants (chambres)'],
  ['general','Étagères de rangement'],
  ['general','Luminaires'],
  ['general','Matériel d\'entretien ménager']
];
const INV_SUGG=['Lit','Matelas','Oreillers','Canapé','Armoire / penderie','Commode','Bureau','Télévision','Lave-linge','Lave-vaisselle','Bouilloire','Cafetière','Grille-pain','Aspirateur','Fer à repasser','Poubelle','Miroir'];
const INV_GROUP_LBL={cuisine:'Cuisine',sejour:'Séjour',chambre:'Chambre(s)',general:'Tout le logement',ajout:'Autres meubles et équipements'};

// ── Utilitaires ─────────────────────────────────────────────────────────────
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const icons=()=>window.lucide&&lucide.createIcons();
function toast(m,ms){const t=$('toast');t.innerHTML=m;t.classList.add('show');icons();clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||3200);}
function fmtD(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'—';}
const _arr=v=>{try{v=typeof v==='string'?JSON.parse(v):v;}catch(e){v=null;}return(Array.isArray(v)?v:(v?[v]:[])).filter(x=>x&&x.name);};
const colocId=c=>c.locataire_id||c.tenant_id||null;
const coSigs=()=>{let v=EDL?.co_signatures;try{v=typeof v==='string'?JSON.parse(v):v;}catch(e){v=null;}return Array.isArray(v)?v:[];};
const coSigOf=id=>coSigs().find(x=>x.tenant_id===id)||null;
// Tous les co-locataires ayant un compte doivent signer
const allColocsSigned=()=>COLOCS.filter(c=>c.hasAccount!==false&&colocId(c)).every(c=>coSigOf(colocId(c)));
const editable=()=>myRole==='landlord'&&EDL&&!EDL.landlord_signed_at&&!EDL.tenant_signed_at;

// ── Modèle initial ──────────────────────────────────────────────────────────
function newRoom(type,name){
  const t=ROOM_TPL[type]||ROOM_TPL.autre;
  return{id:uid(),type,name:name||t.name,elements:t.el.map(l=>({label:l,etat:'',note:''})),photos:[],commentaire:''};
}
function infosEnergie(){
  const Li=LISTING||{},L=LEASE||{};
  const em={gaz:'Gaz naturel',elec:'Électrique',fioul:'Fioul',pac:'Pompe à chaleur',bois:'Bois / granulés',reseau:'Réseau de chaleur'};
  const ch=Li.chauffage_type?(Li.chauffage_type==='collectif'?'Collectif':'Individuel')+(Li.chauffage_mode?' — '+(em[Li.chauffage_mode]||Li.chauffage_mode):''):(L.mode_chauffage||'');
  const ec=Li.ecs_type?(Li.ecs_type==='collectif'?'Collectif':'Individuel (chauffe-eau)')+(Li.ecs_energie?' — '+(em[Li.ecs_energie]||Li.ecs_energie):''):(L.mode_ecs||'');
  return{ch,ec};
}
function defaultData(){
  if(isParking())return{date:BK?.move_in_date||new Date().toISOString().slice(0,10),heure:'',chauffage:'',eau_chaude:'',
    rooms:[newRoom('parking'),newRoom('acces')],inventaire:[],
    compteurs:{elec_num:'',elec_hp:'',elec_hc:'',gaz_num:'',gaz_index:'',eau_froide_num:'',eau_froide_index:'',eau_chaude_num:'',eau_chaude_index:'',photos:[]},
    cles:[{id:uid(),label:'Télécommande du portail',nb:1},{id:uid(),label:'Badge d\'accès',nb:0},{id:uid(),label:'Clé du box / garage',nb:0}],observations:''};
  const pieces=Math.max(1,parseInt(LEASE?.prop_pieces||LISTING?.spots||1)||1);
  const chambres=Math.max(pieces-1,LISTING?.type==='studio'?0:(pieces>1?pieces-1:0));
  const rooms=[newRoom('entree'),newRoom('sejour'),newRoom('cuisine')];
  for(let i=1;i<=chambres;i++)rooms.push(newRoom('chambre',chambres>1?'Chambre '+i:'Chambre'));
  rooms.push(newRoom('sdb'),newRoom('wc'));
  return{
    date:BK?.move_in_date||new Date().toISOString().slice(0,10),

    chauffage:infosEnergie().ch,eau_chaude:infosEnergie().ec,
    rooms,
    inventaire:isVide()?[]:INV_OBLIG.map(([g,l])=>({id:uid(),groupe:g,label:l,qte:1,etat:'',note:'',oblig:true})),
    compteurs:{elec_num:'',elec_hp:'',elec_hc:'',gaz_num:'',gaz_index:'',eau_froide_num:'',eau_froide_index:'',eau_chaude_num:'',eau_chaude_index:'',photos:[]},
    cles:[{id:uid(),label:'Clés de la porte d\'entrée',nb:2},{id:uid(),label:'Badge / bip immeuble',nb:0},{id:uid(),label:'Clé de boîte aux lettres',nb:1}],
    observations:''
  };
}

// ── Chargement ──────────────────────────────────────────────────────────────
(async()=>{
  try{
    const clerk=(typeof window.Clerk==='function')?new window.Clerk(CLERK_KEY):window.Clerk;
    await clerk.load();
    if(clerk.user){U={id:clerk.user.id,email:clerk.user.primaryEmailAddress?.emailAddress||''};$('nav-user').textContent=U.email;}
  }catch(e){console.warn('Clerk',e);}
  await load();
})();

async function load(){
  if(!BOOKING_ID)return fatal('Lien incomplet. Ouvrez l\'état des lieux depuis votre tableau de bord.');
  const{data:bk}=await sb.from('bookings').select('*').eq('id',BOOKING_ID).maybeSingle();
  if(!bk)return fatal('Réservation introuvable.');
  BK=bk;
  const[{data:li},{data:ls},{data:ed}]=await Promise.all([
    sb.from('listings').select('*').eq('id',bk.listing_id).maybeSingle(),
    sb.from('leases').select('*').eq('booking_id',bk.id),
    sb.from('etats_des_lieux').select('*').eq('booking_id',bk.id).eq('type','entree').order('created_at',{ascending:false}).limit(1)
  ]);
  LISTING=li;
  LEASE=(ls||[]).find(l=>l.negotiation_status==='signed')||(ls||[])[0]||null;
  const landlordId=LEASE?.landlord_id||bk.landlord_id,tenantId=LEASE?.tenant_id||bk.tenant_id;
  COLOCS=_arr(bk.co_locataires_data||bk.co_tenants_data);
  COBAILS=_arr(bk.co_bailleurs_data);
  if(U){
    if(U.id===landlordId)myRole='landlord';
    else if(U.id===tenantId||U.id===bk.locataire_id)myRole='tenant';
    else{MY_COLOC=COLOCS.find(c=>colocId(c)===U.id)||null;if(MY_COLOC)myRole='coloc';}
  }
  if(!myRole)return fatal(U?'Cet état des lieux ne concerne pas votre compte.':'Connectez-vous pour accéder à l\'état des lieux.');
  const[{data:lp},{data:tp}]=await Promise.all([
    sb.from('profiles').select('full_name,email,home_address,role').eq('clerk_id',landlordId).maybeSingle(),
    sb.from('profiles').select('full_name,email').eq('clerk_id',tenantId).maybeSingle()
  ]);
  LL_P=lp;T_P=tp;
  // Bien géré par une agence : bailleur = propriétaire, représenté par l'agence (mandataire)
  if(['agent','agence','agency'].includes(lp?.role)){
    let ag=null;try{const{data}=await sb.from('agency_profiles').select('agency_name').eq('clerk_id',landlordId).maybeSingle();ag=data;}catch(e){}
    let owner=LEASE?.landlord_name||li?.manual_landlord_name||'';
    if(!owner&&li?.real_landlord_id){try{const{data:op}=await sb.from('profiles').select('full_name').eq('clerk_id',li.real_landlord_id).maybeSingle();owner=op?.full_name||'';}catch(e){}}
    const agn=ag?.agency_name||lp?.full_name||'l\'agence';
    LL_P={...lp,full_name:owner?`${owner}, représenté par ${agn} (mandataire)`:`${agn} (mandataire du bailleur)`};
  }
  if(!bk.co_bailleurs_data){try{const{data:lpc}=await sb.from('profiles').select('co_bailleur_data').eq('clerk_id',landlordId).maybeSingle();COBAILS=_arr(lpc?.co_bailleur_data);}catch(e){}}
  EDL=(ed||[])[0]||null;
  if(!EDL&&myRole==='landlord'){
    const row={booking_id:bk.id,lease_id:LEASE?.id||null,listing_id:bk.listing_id,landlord_id:landlordId,tenant_id:tenantId,type:'entree',status:'draft',data:defaultData()};
    const{data:created,error}=await sb.from('etats_des_lieux').insert(row).select().single();
    if(error)return fatal('Impossible de créer l\'état des lieux : '+esc(error.message)+'<br><small>Exécutez la migration <strong>supabase-migration-edl.sql</strong> dans Supabase.</small>');
    EDL=created;
    syncBooking({edl_status:'draft'});
  }
  if(!EDL)return fatal('Le propriétaire n\'a pas encore commencé l\'état des lieux. Vous serez prévenu dès qu\'il sera prêt à signer.');
  if(typeof EDL.data==='string'){try{EDL.data=JSON.parse(EDL.data);}catch(e){EDL.data=defaultData();}}
  // Chauffage / eau chaude déjà connus (annonce ou bail) : on les reprend s'ils sont vides
  const _en=infosEnergie();
  if(!EDL.data.chauffage&&_en.ch)EDL.data.chauffage=_en.ch;
  if(!EDL.data.eau_chaude&&_en.ec)EDL.data.eau_chaude=_en.ec;
  if(myRole!=='landlord'||EDL.status!=='draft')STEP=5;
  render();
  setInterval(refreshSigs,15000);
}
function fatal(msg){$('app').innerHTML=`<div class="card" style="text-align:center"><p style="margin-bottom:.8rem">${msg}</p><a class="btn bg" href="/">Retour</a></div>`;}

// ── Sauvegarde ──────────────────────────────────────────────────────────────
function touch(){
  if(!editable())return;
  _dirty=true;setSaveState('Modifications non enregistrées…');
  clearTimeout(_saveT);_saveT=setTimeout(save,900);
}
async function save(){
  if(!_dirty||!editable())return;
  _dirty=false;setSaveState('Enregistrement…');
  const{error}=await sb.from('etats_des_lieux').update({data:EDL.data,updated_at:new Date().toISOString()}).eq('id',EDL.id);
  setSaveState(error?'Erreur d\'enregistrement : '+error.message:'Enregistré ✓');
  if(error)_dirty=true;
}
function setSaveState(t){const e=$('save-state');if(e)e.textContent=t;}
window.addEventListener('beforeunload',e=>{if(_dirty){save();e.preventDefault();e.returnValue='';}});
async function syncBooking(upd){try{await sb.from('bookings').update(upd).eq('id',BK.id);}catch(e){}}

// ── Rendu ───────────────────────────────────────────────────────────────────
const STEPS=[['info','Informations'],['rooms','Pièces'],['inv','Inventaire du mobilier'],['meters','Compteurs'],['keys','Clés'],['sign','Relecture & signatures']];
function stepDone(i){
  const d=EDL.data;
  if(i===0)return !!d.date;
  if(i===1)return d.rooms.length&&d.rooms.every(r=>r.elements.every(e=>e.etat));
  if(i===2)return isVide()?true:d.inventaire.filter(x=>x.oblig).every(x=>x.etat||Number(x.qte)===0);
  if(i===3){const c=d.compteurs;return isParking()||!!(c.elec_hp||c.elec_hc);}
  if(i===4)return d.cles.some(k=>Number(k.nb)>0);
  return !!(EDL.landlord_signed_at&&EDL.tenant_signed_at);
}
function render(){
  const d=EDL.data,ro=!editable();
  const adr=LISTING?.full_address||LEASE?.prop_adresse||LISTING?.zone||'';
  const statusHtml=EDL.landlord_signed_at&&EDL.tenant_signed_at&&allColocsSigned()
    ?`<div class="status st-done"><i data-lucide=check-circle-2 class=ic></i><span>État des lieux signé par les deux parties. Il est annexé au bail.</span></div>`
    :EDL.status==='to_sign'
      ?`<div class="status st-sign"><i data-lucide=pen-line class=ic></i><span>${myRole!=='landlord'?'Relisez l\'état des lieux puis signez en bas de page.':'Prêt à signer — le locataire a été prévenu. Vous pouvez signer dès maintenant.'}</span></div>`
      :`<div class="status st-draft"><i data-lucide=file-pen class=ic></i><span>${myRole!=='landlord'?'Le propriétaire prépare l\'état des lieux.':'Brouillon — remplissez chaque étape (enregistrement automatique), puis passez à la signature.'}</span></div>`;
  $('app').innerHTML=`
    <h1>${isParking()?"État des lieux d'entrée — parking / garage":isVide()?"État des lieux d'entrée":"État des lieux d'entrée & inventaire"}</h1>
    <div class="sub">${isParking()?'Parking / garage · ':isVide()?'Location vide · ':'Location meublée · '}${esc(LISTING?.title||'Logement')}${adr?' · '+esc(adr):''}</div>
    ${statusHtml}
    <div class="steps no-print" role="tablist">${STEPS.map(([k,l],i)=>[k,(k==='rooms'&&isParking())?'Emplacement':(k==='inv'&&isVide())?'Équipements (facultatif)':(k==='meters'&&isParking())?'Compteur (si électrifié)':l]).map(([k,l],i)=>`<button class="step ${i===STEP?'on':''} ${stepDone(i)?'ok':''}" onclick="goStep(${i})"><span class="n">${stepDone(i)?'✓':i+1}</span>${l}</button>`).join('')}</div>
    <div class="${ro?'ro':''}">
      <div class="panel" ${STEP===0?'':'hidden'}>${renderInfo(d,ro)}</div>
      <div class="panel" ${STEP===1?'':'hidden'}>${renderRooms(d,ro)}</div>
      <div class="panel" ${STEP===2?'':'hidden'}>${renderInv(d,ro)}</div>
      <div class="panel" ${STEP===3?'':'hidden'}>${renderMeters(d,ro)}</div>
      <div class="panel" ${STEP===4?'':'hidden'}>${renderKeys(d,ro)}</div>
      <div class="panel" ${STEP===5?'':'hidden'}>${renderSign(d)}</div>
    </div>`;
  renderBar();
  icons();
  if(STEP===5)setTimeout(initPads,30);
}
function goStep(i){STEP=i;render();window.scrollTo({top:0,behavior:'smooth'});}
function renderBar(){
  const b=$('bar');b.style.display='flex';
  const prev=STEP>0?`<button class="btn bg" onclick="goStep(${STEP-1})">← Précédent</button>`:'';
  let next='';
  if(STEP<5)next=`<button class="btn bp" onclick="goStep(${STEP+1})">${STEP===4?'Relecture & signatures':'Suivant'} →</button>`;
  else next=`<button class="btn bg" onclick="window.print()"><i data-lucide=printer class=ic></i> Imprimer / PDF</button>`;
  b.innerHTML=`<span class="save" id="save-state">${editable()?'Enregistrement automatique':''}</span>${prev}${next}`;
}

    ${(d.chauffage||d.eau_chaude)&&!ro?'<p class="legal" style="margin-top:.4rem">Chauffage et eau chaude repris de l\'annonce / du bail — modifiables si besoin.</p>':''}

function renderRooms(d,ro){

  const rooms=d.rooms.map((r,ri)=>{
    const done=r.elements.filter(e=>e.etat).length;
    return`<div class="room ${r._open||ro?'open':''}" id="room-${r.id}">
      <div class="room-h" onclick="if(event.target.tagName!=='INPUT'&&event.target.tagName!=='BUTTON')toggleRoom(${ri})">
        <i data-lucide=${r.type==='cuisine'?'cooking-pot':r.type==='chambre'?'bed-double':r.type==='sdb'?'bath':r.type==='wc'?'droplet':r.type==='entree'?'door-open':r.type==='exterieur'?'trees':(r.type==='parking'||r.type==='acces')?'car':'sofa'} class=ic></i>
        <input value="${esc(r.name)}" ${ro?'disabled':''} aria-label="Nom de la pièce" onchange="EDL.data.rooms[${ri}].name=this.value;touch()">
        <span class="room-prog">${done}/${r.elements.length}${r.photos.length?' · '+r.photos.length+' photo'+(r.photos.length>1?'s':''):''}</span>
      </div>
      <div class="room-b">
        ${r.elements.map((e,ei)=>`<div class="el"><div class="el-name">${esc(e.label)}</div><div class="etats">${etBtns(ri,ei,e.etat)}</div>
          <div class="el-note">${ro?(e.note?`<span style="font-size:.78rem;color:var(--td)">${esc(e.note)}</span>`:''):`<input placeholder="Remarque (rayure, tache, trou…)" value="${esc(e.note)}" onchange="EDL.data.rooms[${ri}].elements[${ei}].note=this.value;touch()">`}</div></div>`).join('')}
        <label class="f" style="margin-top:.6rem">Photos de la pièce</label>
        <div class="photos">${r.photos.map((p,pi)=>`<div class="ph"><a href="${esc(p)}" target="_blank" rel="noopener"><img src="${esc(p)}" alt="Photo ${pi+1} — ${esc(r.name)}" loading="lazy"></a><button aria-label="Supprimer" onclick="delPhoto('room',${ri},${pi})">×</button></div>`).join('')}
          ${ro?'':`<label class="ph-add"><i data-lucide=camera class=ic></i>Ajouter<input type="file" accept="image/*" multiple onchange="addPhotos(this,'room',${ri})"></label>`}</div>
        ${ro?(r.commentaire?`<p style="margin-top:.5rem;font-size:.82rem"><strong>Commentaire :</strong> ${esc(r.commentaire)}</p>`:''):`<textarea class="i" style="margin-top:.6rem" placeholder="Commentaire sur la pièce" onchange="EDL.data.rooms[${ri}].commentaire=this.value;touch()">${esc(r.commentaire)}</textarea>`}
        <div class="row-actions">
          <button class="btn bg bsm" onclick="allEtat(${ri},'bon')"><i data-lucide=check-check class=ic></i> Tout en bon état</button>
          <button class="btn bg bsm" onclick="addElement(${ri})"><i data-lucide=plus class=ic></i> Ajouter un élément</button>
          <button class="btn bg bsm" onclick="dupRoom(${ri})"><i data-lucide=copy class=ic></i> Dupliquer</button>
          <button class="btn bg bsm room-del" style="color:var(--red)" onclick="delRoom(${ri})"><i data-lucide=trash-2 class=ic></i> Supprimer la pièce</button>
        </div>
      </div></div>`;}).join('');
  return`<div class="card"><h2><i data-lucide=layout-grid class=ic></i> ${isParking()?'État de l\'emplacement':'État de chaque pièce'}</h2>

    ${rooms}
    ${ro?'':`<div class="row-actions"><select class="i" id="new-room-type" style="max-width:220px">${Object.entries(ROOM_TPL).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select><button class="btn bp bsm" onclick="addRoom()"><i data-lucide=plus class=ic></i> Ajouter une pièce</button></div>`}
  </div>`;
}
function toggleRoom(ri){const r=EDL.data.rooms[ri];r._open=!r._open;render();}
function setEtat(ri,ei,v){if(!editable())return;const e=EDL.data.rooms[ri].elements[ei];e.etat=e.etat===v?'':v;touch();render();}
function allEtat(ri,v){EDL.data.rooms[ri].elements.forEach(e=>{if(!e.etat)e.etat=v;});touch();render();}
async function addElement(ri){const l=await uiPrompt('Nom de l\'élément (ex. Baignoire, Placard…)');if(!l)return;EDL.data.rooms[ri].elements.push({label:l.trim(),etat:'',note:''});touch();render();}
function addRoom(){const t=$('new-room-type').value;const r=newRoom(t);r._open=true;EDL.data.rooms.push(r);touch();render();}
function dupRoom(ri){const s=EDL.data.rooms[ri];const r=JSON.parse(JSON.stringify(s));r.id=uid();r.name=s.name+' (2)';r.photos=[];r.elements.forEach(e=>{e.etat='';e.note='';});r._open=true;EDL.data.rooms.splice(ri+1,0,r);touch();render();}
async function delRoom(ri){if(!await uiConfirm('Supprimer « '+EDL.data.rooms[ri].name+' » ?'))return;EDL.data.rooms.splice(ri,1);touch();render();}

    return`<div class="inv-group">${INV_GROUP_LBL[g]}</div>`+items.map(([x,i])=>`<div class="inv">
      <div class="lbl">${esc(x.label)}${x.oblig?'<span class="oblig">obligatoire</span>':''}${ro?(x.note?`<small>${esc(x.note)}</small>`:''):`<input style="display:block;width:100%;margin-top:.25rem;padding:.25rem .45rem;border:1px dashed var(--border2);border-radius:6px;font-size:.75rem;font-family:inherit" placeholder="Détail (marque, couleur, défaut…)" value="${esc(x.note)}" onchange="EDL.data.inventaire[${i}].note=this.value;touch()">`}</div>

    ${ro?'':`<div class="row-actions" style="margin-top:.8rem"><input class="i" list="inv-sugg" id="inv-new" placeholder="Ajouter un équipement…" style="flex:1;min-width:180px"><datalist id="inv-sugg">${INV_SUGG.map(s=>`<option value="${s}">`).join('')}</datalist><button class="btn bp bsm" onclick="addInv()"><i data-lucide=plus class=ic></i> Ajouter</button></div>`}
  </div>`;
  return`<div class="card"><h2><i data-lucide=sofa class=ic></i> Inventaire et état du mobilier</h2>

    ${manque.length?`<div class="status st-draft" style="margin-top:0"><i data-lucide=alert-triangle class=ic></i><span>Quantité à 0 pour : ${manque.map(x=>esc(x.label)).join(', ')}. Ces éléments sont requis pour un meublé.</span></div>`:''}
    ${body}
    ${ro?'':`<div class="row-actions" style="margin-top:.8rem"><input class="i" list="inv-sugg" id="inv-new" placeholder="Ajouter un meuble ou équipement…" style="flex:1;min-width:180px"><datalist id="inv-sugg">${INV_SUGG.map(s=>`<option value="${s}">`).join('')}</datalist><button class="btn bp bsm" onclick="addInv()"><i data-lucide=plus class=ic></i> Ajouter</button></div>`}
  </div>`;
}

// 6 — Relecture & signatures
function renderSign(d){
  const missing=[];
  d.rooms.forEach(r=>{const n=r.elements.filter(e=>!e.etat).length;if(n)missing.push(`${r.name} : ${n} élément${n>1?'s':''} sans état`);});
  d.inventaire.filter(x=>x.oblig&&!x.etat&&Number(x.qte)>0).forEach(x=>missing.push(`Inventaire : état de « ${x.label} »`));
  const resume=d.rooms.map(r=>{
    const bad=r.elements.filter(e=>e.etat==='mauvais'||e.etat==='usage'||e.note);
    return`<div style="padding:.45rem 0;border-top:1px solid #F1F1EF"><strong style="font-size:.86rem">${esc(r.name)}</strong>
      <div style="font-size:.78rem;color:var(--td)">${bad.length?bad.map(e=>`${esc(e.label)} : ${ETAT_LBL[e.etat]||'—'}${e.note?' — '+esc(e.note):''}`).join(' · '):'Tous les éléments en bon état ou mieux'}${r.photos.length?` · ${r.photos.length} photo(s)`:''}</div></div>`;}).join('');
  const both=EDL.landlord_signed_at&&EDL.tenant_signed_at&&allColocsSigned();
  const canSign=EDL.status==='to_sign'||EDL.landlord_signed_at||EDL.tenant_signed_at;
  const sigBox=(who,lbl,name,sig,at)=>{
    let inner;
    if(at&&sig)inner=`<div class="sig-done"><img src="${sig}" alt="Signature ${lbl}"><div class="ok"><i data-lucide=check-circle-2 class=ic></i> Signé le ${new Date(at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div></div>`;
    else if(!canSign)inner='En attente de la fin de la saisie';
    else if(myRole===who)inner=`<canvas class="pad" id="pad-${who}" width="600" height="160" aria-label="Zone de signature"></canvas><div style="display:flex;gap:.4rem"><button class="btn bg bsm" onclick="clearPad('${who}')">Effacer</button><button class="btn bgr bsm" onclick="signer('${who}')"><i data-lucide=pen-line class=ic></i> Signer</button></div>`;
    else inner=`<span><i data-lucide=hourglass class=ic></i> En attente de la signature ${who==='landlord'?'du bailleur':'du locataire'}</span>`;
    return`<div class="sig"><div class="sig-h">${lbl}<strong>${esc(name||'—')}</strong></div><div class="sig-b">${inner}</div></div>`;
  };
  return`
    ${myRole==='landlord'&&!canSign?`<div class="card"><h2><i data-lucide=list-checks class=ic></i> Avant de faire signer</h2>
      ${missing.length?`<div class="hint">Il reste à compléter :</div><ul style="font-size:.82rem;margin:0 0 .8rem 1.1rem">${missing.slice(0,8).map(m=>`<li>${esc(m)}</li>`).join('')}${missing.length>8?`<li>… et ${missing.length-8} autre(s)</li>`:''}</ul>`:'<div class="hint">Tout est rempli.</div>'}
      <button class="btn bp" onclick="finaliser()" ${missing.length?'':''}><i data-lucide=send class=ic></i> Terminer et faire signer</button>
      <p class="legal" style="margin-top:.5rem">Le contenu ne pourra plus être modifié une fois qu'une des parties a signé.</p></div>`:''}
    <div class="card"><h2><i data-lucide=clipboard-check class=ic></i> Récapitulatif</h2>
      <div class="legal" style="margin-bottom:.4rem">Date : <strong>${fmtD(d.date)}${d.heure?' à '+esc(d.heure):''}</strong> · Chauffage : ${esc(d.chauffage||'—')} · Eau chaude : ${esc(d.eau_chaude||'—')}</div>
      ${resume}
      <div style="padding:.45rem 0;border-top:1px solid #F1F1EF;font-size:.8rem"><strong>Compteurs :</strong> électricité ${esc(d.compteurs.elec_hp||'—')}${d.compteurs.elec_hc?' / HC '+esc(d.compteurs.elec_hc):''} kWh · gaz ${esc(d.compteurs.gaz_index||'—')} m³ · eau froide ${esc(d.compteurs.eau_froide_index||'—')} m³${d.compteurs.eau_chaude_index?' · eau chaude '+esc(d.compteurs.eau_chaude_index)+' m³':''}</div>
      <div style="padding:.45rem 0;border-top:1px solid #F1F1EF;font-size:.8rem"><strong>Clés :</strong> ${d.cles.filter(k=>Number(k.nb)>0).map(k=>`${esc(k.nb)} × ${esc(k.label)}`).join(' · ')||'—'}</div>
      <div style="padding:.45rem 0;border-top:1px solid #F1F1EF;font-size:.8rem"><strong>${isVide()?'Équipements':'Inventaire'} :</strong> ${d.inventaire.filter(x=>Number(x.qte)>0).length} élément(s) listé(s)</div>
      <div class="no-print" style="margin-top:.5rem"><button class="btn bg bsm" onclick="goStep(1)">Voir le détail des pièces</button> <button class="btn bg bsm" onclick="goStep(2)">${isVide()?'Voir les équipements':"Voir l'inventaire"}</button></div>
    </div>
    <div class="card"><h2><i data-lucide=pen-line class=ic></i> Signatures</h2>
      <div class="hint">Chacun signe depuis son propre compte, dans n'importe quel ordre — sur place, chacun sur son téléphone.</div>
      <div class="sigs">
        ${sigBox('landlord','Le bailleur',LL_P?.full_name,EDL.landlord_signature,EDL.landlord_signed_at)}
        ${sigBox('tenant','Le locataire',T_P?.full_name||BK?.tenant_name,EDL.tenant_signature,EDL.tenant_signed_at)}
        ${COLOCS.filter(c=>colocId(c)).map(c=>{const cs=coSigOf(colocId(c));return sigBoxColoc(c,cs);}).join('')}
      </div>
      ${COBAILS.length?`<p class="legal" style="margin-top:.6rem">Co-bailleur${COBAILS.length>1?'s':''} (${COBAILS.map(c=>esc(c.name)).join(', ')}) représenté${COBAILS.length>1?'s':''} par le bailleur signataire.</p>`:''}
      <p class="legal" style="margin-top:.8rem">Établi contradictoirement entre les parties (art. 3-2 de la loi n° 89-462 du 6 juillet 1989 ; décret n° 2016-382). Le locataire peut demander au bailleur de compléter cet état des lieux dans les <strong>10 jours</strong> suivant sa signature, et pendant le premier mois de la période de chauffe pour les éléments de chauffage.</p>
    </div>
    ${both?renderReserves():''}`;
}
function sigBoxColoc(c,cs){
  const id=colocId(c),canSign=EDL.status==='to_sign'||EDL.landlord_signed_at||EDL.tenant_signed_at;
  let inner;
  if(cs)inner=`<div class="sig-done"><img src="${cs.signature}" alt="Signature ${esc(c.name)}"><div class="ok"><i data-lucide=check-circle-2 class=ic></i> Signé le ${new Date(cs.signed_at).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div></div>`;
  else if(!canSign)inner='En attente de la fin de la saisie';
  else if(myRole==='coloc'&&U?.id===id)inner=`<canvas class="pad" id="pad-coloc" width="600" height="160" aria-label="Zone de signature"></canvas><div style="display:flex;gap:.4rem"><button class="btn bg bsm" onclick="clearPad('coloc')">Effacer</button><button class="btn bgr bsm" onclick="signer('coloc')"><i data-lucide=pen-line class=ic></i> Signer</button></div>`;
  else inner='<span><i data-lucide=hourglass class=ic></i> En attente de la signature du co-locataire</span>';
  return`<div class="sig"><div class="sig-h">Co-locataire<strong>${esc(c.name)}</strong></div><div class="sig-b">${inner}</div></div>`;
}
function renderReserves(){
  const until=new Date(new Date(EDL.tenant_signed_at).getTime()+10*864e5);
  const open=myRole==='tenant'&&Date.now()<until.getTime();
  return`<div class="card"><h2><i data-lucide=message-square-warning class=ic></i> Compléments du locataire (10 jours)</h2>
    ${EDL.tenant_reserves?`<p style="font-size:.85rem;white-space:pre-line">${esc(EDL.tenant_reserves)}</p>`:'<div class="hint">Aucun complément signalé.</div>'}
    ${open?`<div class="no-print"><textarea class="i" id="reserves" rows="3" placeholder="Défaut constaté après l'entrée (ex. radiateur de la chambre qui ne chauffe pas)…"></textarea>
      <button class="btn bp bsm" style="margin-top:.5rem" onclick="envoyerReserves()"><i data-lucide=send class=ic></i> Envoyer au bailleur</button>
      <p class="legal" style="margin-top:.3rem">Possible jusqu'au ${until.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}.</p></div>`:''}
  </div>`;
}

// ── Photos (compressées avant envoi) ────────────────────────────────────────
async function compress(file){
  if(!file.type.startsWith('image/'))return file;
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const max=1600,s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.78));
}
async function addPhotos(input,kind,ri){
  if(!editable())return;
  const files=[...input.files];if(!files.length)return;
  toast('<i data-lucide=upload class=ic></i> Envoi de '+files.length+' photo(s)…',8000);
  for(const f of files){
    try{
      const blob=await compress(f);
      const path=`edl/${EDL.id}/${Date.now()}-${uid()}.jpg`;
      const{error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});
      if(error)throw error;
      const url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      if(kind==='room')EDL.data.rooms[ri].photos.push(url);else (EDL.data.compteurs.photos=EDL.data.compteurs.photos||[]).push(url);
    }catch(e){toast('<i data-lucide=alert-triangle class=ic></i> Photo non envoyée : '+(e.message||e),6000);}
  }
  touch();render();toast('<i data-lucide=check-circle-2 class=ic></i> Photos ajoutées');
}
async function delPhoto(kind,ri,pi){
  if(!editable()||!await uiConfirm('Supprimer cette photo ?'))return;
  if(kind==='room')EDL.data.rooms[ri].photos.splice(pi,1);else EDL.data.compteurs.photos.splice(pi,1);
  touch();render();
}

// ── Finalisation et signatures ──────────────────────────────────────────────
async function finaliser(){
  const d=EDL.data;
  const vides=d.rooms.reduce((n,r)=>n+r.elements.filter(e=>!e.etat).length,0);
  if(vides&&!await uiConfirm(vides+' élément(s) n\'ont pas d\'état. Faire signer quand même ?'))return;
  _dirty=true;await save();
  const{error}=await sb.from('etats_des_lieux').update({status:'to_sign',sent_at:new Date().toISOString()}).eq('id',EDL.id);
  if(error)return toast('Erreur : '+esc(error.message),6000);
  EDL.status='to_sign';
  await syncBooking({edl_status:'to_sign',edl_date:d.date});
  try{await sb.from('messages').insert({listing_id:BK.listing_id,sender_id:'system',receiver_id:BK.tenant_id,content:`L'état des lieux d'entrée et l'inventaire du mobilier sont prêts.\n\nRelisez-les et signez :\n${location.origin}/edl-meuble.html?booking_id=${BK.id}`,type:'message'});}catch(e){}
  toast('<i data-lucide=send class=ic></i> Prêt à signer — le locataire a été prévenu');
  STEP=5;render();
}
let _pads={};
function initPads(){
  ['landlord','tenant','coloc'].forEach(w=>{
    const c=$('pad-'+w);if(!c||c._init)return;c._init=true;
    const ctx=c.getContext('2d');ctx.lineWidth=2.6;ctx.lineCap='round';ctx.strokeStyle='#1B4FD8';
    let on=false,lx=0,ly=0;_pads[w]={c,used:false};
    const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height];};
    const st=e=>{e.preventDefault();on=true;[lx,ly]=pos(e);};
    const mv=e=>{if(!on)return;e.preventDefault();const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y;_pads[w].used=true;};
    const en=()=>{on=false;};
    c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);window.addEventListener('mouseup',en);
    c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en);
  });
}
function clearPad(w){const p=_pads[w];if(!p)return;p.c.getContext('2d').clearRect(0,0,p.c.width,p.c.height);p.used=false;}
async function signer(who){
  if(myRole!==who)return toast('Vous ne pouvez signer que pour vous-même.');
  if(who==='coloc')return signerColoc();
  const p=_pads[who];if(!p||!p.used)return toast('Dessinez votre signature dans la zone.');
  if(!await uiConfirm('Je certifie avoir vérifié cet état des lieux et cet inventaire. Signer ?'))return;
  const now=new Date().toISOString(),sig=p.c.toDataURL('image/png');
  const upd=who==='landlord'?{landlord_signature:sig,landlord_signed_at:now}:{tenant_signature:sig,tenant_signed_at:now};
  // relire l'état réel (l'autre partie a peut-être signé en même temps)
  const{data:fresh}=await sb.from('etats_des_lieux').select('landlord_signed_at,tenant_signed_at,landlord_signature,tenant_signature').eq('id',EDL.id).single();
  if(fresh)Object.assign(EDL,fresh);
  const lDone=who==='landlord'||!!EDL.landlord_signed_at,tDone=who==='tenant'||!!EDL.tenant_signed_at;
  if(lDone&&tDone&&allColocsSigned())upd.status='signed';
  const{error}=await sb.from('etats_des_lieux').update(upd).eq('id',EDL.id);
  if(error)return toast('Erreur : '+esc(error.message),6000);
  Object.assign(EDL,upd);
  await syncBooking(who==='landlord'?{edl_signed_landlord:true}:{edl_signed_tenant:true});
  const other=who==='landlord'?BK.tenant_id:(LEASE?.landlord_id||BK.landlord_id);
  if(lDone&&tDone&&allColocsSigned()){
    await terminerEntree();
  }else{
    try{await sb.from('messages').insert({listing_id:BK.listing_id,sender_id:'system',receiver_id:other,content:`${who==='landlord'?'Le bailleur':'Le locataire'} a signé l'état des lieux d'entrée. À vous de signer :\n${location.origin}/edl-meuble.html?booking_id=${BK.id}`,type:'message'});}catch(e){}
    toast('<i data-lucide=check-circle-2 class=ic></i> Signé — en attente de l\'autre partie');
  }
  render();
}
async function signerColoc(){
  const p=_pads.coloc;if(!p||!p.used)return toast('Dessinez votre signature dans la zone.');
  if(!await uiConfirm('Je certifie avoir vérifié cet état des lieux et cet inventaire. Signer ?'))return;
  const{data:fresh}=await sb.from('etats_des_lieux').select('*').eq('id',EDL.id).single();
  if(fresh)Object.assign(EDL,fresh);
  const list=coSigs().filter(x=>x.tenant_id!==U.id);
  list.push({tenant_id:U.id,name:MY_COLOC?.name||'',signature:p.c.toDataURL('image/png'),signed_at:new Date().toISOString()});
  const upd={co_signatures:list};
  EDL.co_signatures=list;
  const complete=!!EDL.landlord_signed_at&&!!EDL.tenant_signed_at&&allColocsSigned();
  if(complete)upd.status='signed';
  const{error}=await sb.from('etats_des_lieux').update(upd).eq('id',EDL.id);
  if(error)return toast('Erreur : '+esc(error.message)+' (migration EDL à jour ?)',7000);
  Object.assign(EDL,upd);
  if(complete)await terminerEntree();
  else toast('<i data-lucide=check-circle-2 class=ic></i> Signé — en attente des autres signatures');
  render();
}
// Les deux ont signé → entrée terminée (même mécanisme que RestMalta)
async function terminerEntree(){
  const now=new Date().toISOString();
  await syncBooking({status:'move_in_ready',edl_status:'signed',edl_signed_landlord:true,edl_signed_tenant:true,edl_completed_at:now});
  try{await sb.from('listings').update({active:false,actif:false,status:'rented'}).eq('id',BK.listing_id);}
  catch(e){}
  // si la colonne « actif » n'existe pas, refaire sans elle
  try{const{error}=await sb.from('listings').update({active:false,status:'rented'}).eq('id',BK.listing_id);}catch(e){}
  const msg=`Entrée dans les lieux terminée !\n\n✓ Bail signé\n✓ État des lieux et inventaire signés par les deux parties\n✓ Clés remises\n\nRetrouvez tous les documents dans votre espace.`;
  const ll=LEASE?.landlord_id||BK.landlord_id;
  const dest=[BK.tenant_id,ll,...COLOCS.map(colocId).filter(Boolean)];
  try{await sb.from('messages').insert(dest.map(r=>({listing_id:BK.listing_id,sender_id:'system',receiver_id:r,content:msg,type:'move_in_complete'})));}catch(e){}
  toast('<i data-lucide=party-popper class=ic></i> État des lieux signé par les deux parties — entrée terminée !',5000);
}
async function envoyerReserves(){
  const t=$('reserves').value.trim();if(!t)return;
  const all=(EDL.tenant_reserves?EDL.tenant_reserves+'\n\n':'')+new Date().toLocaleDateString('fr-FR')+' : '+t;
  const{error}=await sb.from('etats_des_lieux').update({tenant_reserves:all}).eq('id',EDL.id);
  if(error)return toast('Erreur : '+esc(error.message),6000);
  EDL.tenant_reserves=all;
  try{await sb.from('messages').insert({listing_id:BK.listing_id,sender_id:'system',receiver_id:LEASE?.landlord_id||BK.landlord_id,content:`Le locataire complète l'état des lieux d'entrée :\n\n« ${t} »\n\n${location.origin}/edl-meuble.html?booking_id=${BK.id}`,type:'message'});}catch(e){}
  toast('<i data-lucide=check-circle-2 class=ic></i> Envoyé au bailleur');render();
}
async function refreshSigs(){
  if(!EDL||document.hidden||(EDL.landlord_signed_at&&EDL.tenant_signed_at&&allColocsSigned()))return;
  const drawing=Object.values(_pads).some(p=>p.used);
  const{data:f}=await sb.from('etats_des_lieux').select('*').eq('id',EDL.id).single();
  if(!f)return;
  const changed=['status','landlord_signed_at','tenant_signed_at'].some(k=>(f[k]||null)!==(EDL[k]||null))||JSON.stringify(f.co_signatures||[])!==JSON.stringify(EDL.co_signatures||[]);
  delete f.data;
  if(changed){Object.assign(EDL,f);if(!drawing){_pads={};render();}}
}
</script>
